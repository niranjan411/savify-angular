@if (state.drawerOpen()) {
  <div class="overlay" (click)="state.closeDrawer()"></div>
  <aside class="drawer" role="navigation" aria-label="Side menu">
    <div class="drawer-header">
      <div class="drawer-logo">
        <span class="logo-icon">✦</span>
        <span>Savify</span>
      </div>
      <button class="close-btn" (click)="state.closeDrawer()" aria-label="Close menu">
        <ion-icon name="close"></ion-icon>
      </button>
    </div>
    <div class="drawer-profile">
      <div class="avatar">S</div>
      <div class="profile-info">
        <div class="profile-name">My Vault</div>
        <div class="profile-sub">Personal workspace</div>
      </div>
    </div>
    <nav class="drawer-nav">
      @for (item of state.drawerItems; track item.label) {
        <button class="nav-item" (click)="state.closeDrawer()">
          <span class="nav-icon"><ion-icon [name]="item.icon"></ion-icon></span>
          <span class="nav-label">{{ item.label }}</span>
          <ion-icon name="chevron-forward" class="nav-arrow"></ion-icon>
        </button>
      }
    </nav>
    <div class="drawer-footer">
      <div class="version-badge">v1.0.0</div>
      <p>Made with ♥ by Savify</p>
    </div>
  </aside>
}
